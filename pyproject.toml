[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.5.0",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.21",
    "mysql-connector-python>=26.10.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
]

[project.scripts]
data-agent = "data_agent:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
